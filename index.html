 const aux=`<div class="aux"><div style="text-align:center"><div class="back ${dk?'t':''}" ${dk?`onclick="takeDraw('deck')"`:''}></div><small>抽牌堆 ${G.deck.length}</small></div><div class="dz ${dz?'t':''}" ${dz?'onclick="dzClick()"':''} style="text-align:center"><div class="disc">${dh||'<span style="color:var(--mut);font-size:12px">（空）</span>'}</div><small>棄牌堆 ${G.disc.length}</small></div></div>`;
 const status=(G.hs?p.name+'：':'')+(G.phase==='draw'?(lk?`${p.name} 抽牌中…`:`點抽牌堆或棄牌堆頂抽牌（還可抽 ${G.drawLeft} 張）`):lk?(p.cpu?`${p.name} 思考中…`:`等待 ${p.name}…`):st?'無法出牌：點一張手牌丟棄':sc?'點牌堆出牌・再點手牌變換・點棄牌堆丟棄':'選一張手牌');
 const chip=(q,i)=>`<div class="pl ${i===G.cur?'on':''}" data-p="${i}">${q.name}${G.mode==='online'&&i===ME?'（你）':''} ${q.flip?'▼':'▲'} <b>${DS[i]??q.score}</b> 分${i===vi?'':`<span class="mbs">${'<i class="mb"></i>'.repeat(q.hand.length)}</span>`}</div>`,idx=G.players.map((q,i)=>i),ops=idx.filter(i=>G.players[i].flip!==hp.flip),mates=idx.filter(i=>i!==vi&&G.players[i].flip===hp.flip);
 const hand=hp.hand.map((c,i)=>`<div class="w" onclick="pick(${i})"><div class="c ${mine&&G.sel===i?'sel':''} ${st&&mine?'dis':''}">${svg(em(c))}</div><small>${c.n}${c.rot?' ↻':''}</small></div>`).join('');
 $.innerHTML=`<div class="gm"><div class="hd"><span>${G.team?`組${vi%2+1} ${tds(vi)}：${tds(vi+1)} 組${(vi+1)%2+1}・`:''}目標 ${G.target?G.target+' 分':'不限'}</span><span class="stat">${status}</span><span><button class="b g sm" onclick="settings()">⚙</button> <button class="b g sm" onclick="quit()">大廳</button></span></div>
 <div class="zone opp ${ops.includes(G.cur)?'on':''}">${ops.map(i=>chip(G.players[i],i)).join('')}</div>
 <div class="mid" onclick="if(G.sel!==null&&G.phase==='play'){G.sel=null;render()}"><div class="piles">${ps}</div>${aux}<div id="log">${G.log.slice(-2).reverse().join('<br>')}</div></div>
 <div class="zone me ${ops.includes(G.cur)?'':'on'}"><div class="chips">${idx.filter(i=>i===vi||mates.includes(i)).map(i=>chip(G.players[i],i)).join('')}</div><div class="hand">${hand}</div></div></div>`;
 if(G.ev&&G.ev.id>fxSeen){fxSeen=G.ev.id;enqueueFx(G.ev)}
}
function dzClick(){if(G.phase==='draw')takeDraw('disc');else discardSel()}
function pick(i){
 if(G.phase!=='play'||lock())return;
 if(stuck(P()))return discard(i);
 if(G.sel===i)return rotSel();G.sel=i;render();
}
function place(i,ci){
 const p=P(),k=ci??G.sel,c=p.hand[k],r=resP(c,i);if(!r)return;
 p.hand.splice(k,1);
 sfx.place();let pl;if(i<0){pl={cards:[],m:0};G.piles.push(pl)}else pl=G.piles[i];
 pl.cards.push(c);pl.m=vw(r.m,p.flip);pl.last=vw(em(c),p.flip);G.sel=null;
 let t=`${p.name} 出「${c.n}」${i<0?'開新牌堆':'疊上牌堆'}`;
 if(r.dig===undefined){G.log.push(t+'，未組成數字，抽 1 張');G.drawLeft=1;return startDraw()}
 p.score+=r.pts;G.ev={id:(G.evn=(G.evn||0)+1),p:G.cur,pi:G.piles.indexOf(pl),pts:r.pts,pre:p.score-r.pts,full:r.m===FULL?1:0};t+=`，組成 ${r.dig}（${p.name}的視角），${r.pts?'+'+r.pts+' 分':'不得分'}`;
 if(r.m===FULL){pl.cards.forEach(x=>x.rot=0);G.deck.push(...pl.cards);G.piles.splice(G.piles.indexOf(pl),1);sh(G.deck);t+='；牌堆滿 8，回收並洗牌'}
 G.log.push(t);G.drawLeft=r.dig===0?2:1;startDraw();
}
function discard(k){
 const p=P(),c=p.hand.splice(k,1)[0];c.rot=0;sfx.disc();G.disc.push(c);G.log.push(`${p.name} 無法出牌，丟棄「${c.n}」`);advance();
}
function startDraw(){
 if(!G.deck.length&&G.disc.length){G.deck=sh(G.disc.splice(0));G.reshuf=(G.reshuf||0)+1;G.log.push('抽牌堆用盡，棄牌堆全部洗牌放回抽牌堆')}
 if(G.drawLeft<=0||(!G.deck.length&&!G.disc.length)){return advance()}
 G.phase='draw';render();sync();
 {const g0=G;if(P().cpu)setTimeout(()=>G===g0&&cpuDraw(),800)}
}
function takeDraw(src){
 const p=P(),c=src==='deck'?G.deck.pop():G.disc.pop();if(!c)return;
 c.rot=0;sfx.draw();p.hand.push(c);G.drawLeft--;G.log.push(`${p.name} 從${src==='deck'?'抽牌堆':'棄牌堆'}拿牌`);startDraw();
}
function cpuDraw(){
 const top=G.disc[G.disc.length-1];
 const want=G.level&&top&&ors(top.m).some(r=>targets(top,r).some(i=>resP(top,i,r).dig!==undefined));
 takeDraw(want||!G.deck.length?'disc':'deck');
}
function advance(){
 G.phase='play';G.drawLeft=0;G.turns++;
 if(!G.players.some(p=>p.hand.length)||G.turns>800||(G.target&&G.players.some((p,i)=>tsc(i)>=G.target))){G.over=true;sync();return render()}
 do{G.cur=(G.cur+1)%G.players.length}while(!P().hand.length);
 if(G.hs){sfx.flip();G.fa=1}render();G.fa=0;sync();
 {const g0=G;if(P().cpu)setTimeout(()=>G===g0&&cpu(),900)}
}
function cpu(){
 const L=G.level,h=P().hand;let best=null,bv=-1e9;const cv=h.map(()=>-1e9);
 h.forEach((c,k)=>ors(c.m).forEach(rt=>targets(c,rt).forEach(i=>{const r=resP(c,i,rt);
  const nf=((G.cur+1)%G.players.length)%2^P().flip,om=vw(r.m,nf),tt=TYPES.map(t=>ORI(t.m).map(x=>!(x&om)&&D2[x|om]!==undefined?D2[x|om]:-1)),risk=r.m===FULL?0:L>1?tt.reduce((s,a,j)=>s+TYPES[j].k*Math.max(0,...a),0)/20:L?tt.filter(a=>Math.max(...a)>=0).length*.6:0; // 對手下一張能得分的牌種數
  const v=r.pts*3+(r.dig===undefined?0:r.dig===0?4:1.5)-risk+Math.random()*[12,.5,.15][L];
  if(v>cv[k])cv[k]=v;if(v>bv){bv=v;best=[i,k,rt]}})));
 if(best&&(L<1||bv>(L>1?-3:-1.5))){h[best[1]].rot=best[2];place(best[0],best[1])} // 出牌太危險就改丟牌
 else{let k=0;if(best)h.forEach((c,j)=>{if(cv[j]<cv[k])k=j});else h.forEach((c,j)=>{if(pc(c.m)>pc(h[k].m))k=j});discard(k)}
}
splash();
</script></body></html>
